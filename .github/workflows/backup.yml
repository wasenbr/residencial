name: Backup
# Exporta o banco D1 toda semana, criptografa e guarda como artifact por 90 dias.
# O repositório é público: o arquivo só sai daqui criptografado.
# Segredos: CLOUDFLARE_API_TOKEN (token só deste backup, "D1: Edit": o export exige),
# CLOUDFLARE_ACCOUNT_ID e BACKUP_SENHA (chave aleatória: openssl rand -base64 32).
# Restauração: docs/backup.md
on:
  schedule:
    - cron: '0 6 * * 1' # segunda, 03:00 em Brasília
  workflow_dispatch:
concurrency: backup
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Exportar D1
        run: npx wrangler d1 export residencial --remote --output backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Criptografar
        run: |
          test -s backup.sql
          gzip -9 backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.sql.gz -out "residencial-$(date -u +%F).sql.gz.enc" -pass env:BACKUP_SENHA
          rm backup.sql.gz
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: residencial-*.sql.gz.enc
          retention-days: 90
          if-no-files-found: error
